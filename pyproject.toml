[project]
name = "tinytest"
version = "0.1.0"
description = "A/B evaluation harness: TinyFish Search/Fetch vs the Rollout pipeline's native search and fetch paths"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinytest"]

[tool.ruff]
line-length = 100
target-version = "py311"